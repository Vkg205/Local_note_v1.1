name: LocalNote Release - Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-win-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Prepare diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force .\artifacts | Out-Null

      - name: Pre-check repository upload
        continue-on-error: true
        shell: pwsh
        run: |
          & .\validate-project.ps1 2>&1 | Tee-Object -FilePath .\artifacts\validate.log
          exit 0

      - name: Restore compile dependencies
        shell: pwsh
        run: dotnet restore .\src\LocalNote.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build .\src\LocalNote.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -bl:.\artifacts\LocalNote-release-build.binlog

      - name: Publish self-contained win-x64 EXE
        shell: pwsh
        run: >-
          dotnet publish .\src\LocalNote.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
          -bl:.\artifacts\LocalNote-release-publish.binlog
          -o .\dist\win-x64

      - name: Verify and package
        shell: pwsh
        run: |
          $exe = '.\dist\win-x64\LocalNote.exe'
          if (!(Test-Path $exe)) { throw 'LocalNote.exe was not produced.' }
          $name = '${{ github.ref_name }}'
          if ([string]::IsNullOrWhiteSpace($name)) { $name = 'manual' }
          $zip = ".\artifacts\LocalNote-$name-win-x64.zip"
          Compress-Archive -Path .\dist\win-x64\* -DestinationPath $zip -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalNote-${{ github.ref_name }}-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = Get-ChildItem ".\artifacts\LocalNote-$tag-win-x64.zip" | Select-Object -First 1
          gh release create $tag $zip.FullName --generate-notes --title "LocalNote $tag"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LocalNote-release-diagnostics-${{ github.run_id }}
          path: |
            artifacts/*.log
            artifacts/*.binlog
          if-no-files-found: ignore
          retention-days: 7
